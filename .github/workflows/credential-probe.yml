name: Credential scope experiment
# Temporary, branch-only experiment. Never bind a real credential here.
# Fresh run after fixture setup; compare deployment-record settings.
on:
  push:
    branches: [fix/environment-secret-declaration]
permissions: {}
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    strategy:
      matrix:
        environment: [ci-engine-credential-probe]
        secret_name: [ENGINE_PROBE_SECRET]
        variable_name: [ENGINE_PROBE_VARIABLE]
        deployment: [true, false]
    environment:
      name: ${{ matrix.environment }}
      deployment: ${{ matrix.deployment }}
    steps:
      - name: Compare presence without logging credentials
        shell: bash
        env:
          STATIC_SECRET: ${{ secrets.ENGINE_PROBE_SECRET }}
          DYNAMIC_SECRET: ${{ secrets[matrix.secret_name] }}
          CONTROL_VARIABLE: ${{ vars[matrix.variable_name] }}
        run: |
          set -euo pipefail
          for key in STATIC_SECRET DYNAMIC_SECRET CONTROL_VARIABLE; do
            if [[ "${!key}" == "engine-probe-only" ]]; then
              echo "$key: expected fixture present"
            elif [[ -z "${!key}" ]]; then
              echo "$key: absent"
            else
              echo "$key: unexpected value (not printed)"
            fi
          done

      - name: Require initialized disposable fixture
        shell: bash
        env:
          CONTROL: ${{ secrets.ENGINE_PROBE_SECRET }}
          VARIABLE: ${{ vars.ENGINE_PROBE_VARIABLE }}
        run: |
          [[ "$CONTROL" == "engine-probe-only" && "$VARIABLE" == "engine-probe-only" ]] || {
            echo "::error::Set the disposable probe secret and variable before interpreting the experiment."
            exit 1
          }
  undeclared:
    uses: ./.github/workflows/credential-probe-undeclared.yml
  declared:
    uses: ./.github/workflows/credential-probe-declared.yml
  explicitly_forwarded:
    uses: ./.github/workflows/credential-probe-declared.yml
    secrets:
      ENGINE_PROBE_SECRET: ${{ secrets.ENGINE_PROBE_SECRET }}
