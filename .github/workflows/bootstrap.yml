name: CI Engine

on:
  workflow_call:
    inputs:
      request:
        description: Independent dispatch request envelope
        type: string
        required: false
        default: ''
      operation:
        description: Consumer-defined operation selected by the calling workflow
        type: string
        required: true
      component_variables:
        description: Explicit JSON object of non-secret component bindings
        type: string
        required: false
        default: "{}"
      publish:
        description: Explicit manual publication confirmation
        type: boolean
        required: false
        default: false
    secrets:
      app_private_key:
        description: Optional GitHub App private key for trusted publication
        required: false
      bootstrap_token:
        description: Optional scoped bootstrap token for trusted publication
        required: false
      component_credentials:
        description: Explicit JSON object of credentials for protected component execution
        required: false

# Each caller defines the maximum permissions; planning jobs downgrade to read-only.
# Execute inherits the caller ceiling so protected and untrusted invocations differ.
jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      event: ${{ steps.admit.outputs.event }}
      ref: ${{ steps.admit.outputs.ref }}
      sha: ${{ steps.admit.outputs.sha }}
      checkout: ${{ steps.admit.outputs.checkout }}
      action: ${{ steps.admit.outputs.action }}
      trusted: ${{ steps.admit.outputs.trusted }}
      check: ${{ steps.admit.outputs.check }}
      inputs: ${{ steps.admit.outputs.inputs }}
      operation: ${{ steps.route.outputs.operation }}
      mode: ${{ steps.route.outputs.mode }}
      environment: ${{ steps.route.outputs.environment }}
      publication: ${{ steps.route.outputs.publication }}
    steps:
      - name: Admit immutable execution request
        id: admit
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: admit
          request: ${{ inputs.request }}
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admit.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve configured operation
        id: route
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ORIGIN_EVENT: ${{ steps.admit.outputs.event }}
          CI_ORIGIN_REF: ${{ steps.admit.outputs.ref }}
          CI_ORIGIN_SHA: ${{ steps.admit.outputs.sha }}
          CI_ORIGIN_ACTION: ${{ steps.admit.outputs.action }}
          CI_ORIGIN_INPUTS: ${{ steps.admit.outputs.inputs }}
        with:
          phase: resolve
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  prepare:
    name: Prepare
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Prepare workspace
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.resolve.outputs.operation }}
        with:
          phase: prepare
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  discover:
    name: Discover
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Discover declared work
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: discover
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  inspect:
    name: Inspect
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Inspect event and trust policy
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: inspect
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  plan:
    name: Plan
    needs: [resolve, discover]
    outputs:
      host_tests: ${{ steps.plan.outputs.host_tests }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      host_artifact: ${{ steps.plan.outputs.host_artifact }}
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Build validated execution graph
        id: plan
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: plan
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  authorize:
    name: Authorize
    needs: [resolve, plan, inspect]
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.permission.outputs.operation }}
      mode: ${{ steps.permission.outputs.mode }}
      environment: ${{ steps.permission.outputs.environment }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Validate trust boundary
        id: permission
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
        with:
          phase: authorize
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  execute:
    name: Execute
    needs: [resolve, prepare, plan, authorize]
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    environment:
      name: ${{ (needs.authorize.outputs.mode == 'protected' || needs.authorize.outputs.mode == 'generated') && needs.authorize.outputs.environment || 'ci-readonly' }}
      deployment: false
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute read-only components
        if: ${{ needs.authorize.outputs.mode == 'readonly' }}
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.authorize.outputs.operation }}
        with:
          phase: execute
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Execute trusted generated adapter
        if: ${{ needs.authorize.outputs.mode == 'generated' && (env.ACT == 'true' || needs.resolve.outputs.trusted == 'true') }}
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.authorize.outputs.operation }}
          CI_CREDENTIAL_ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          CI_CREDENTIAL_APP_ID: ${{ vars.CI_APP_ID }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
          CI_CREDENTIAL_BOOTSTRAP_TOKEN: ${{ secrets.bootstrap_token }}
          GH_TOKEN: ${{ github.token }}
        with:
          phase: generated
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Execute protected components
        if: ${{ needs.authorize.outputs.mode == 'protected' && needs.resolve.outputs.trusted == 'true' }}
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.authorize.outputs.operation }}
          CI_COMPONENT_CREDENTIALS: ${{ secrets.CI_COMPONENT_CREDENTIALS || secrets.component_credentials }}
          CI_COMPONENT_VARIABLES: ${{ vars.CI_COMPONENT_VARIABLES || inputs.component_variables }}
          CI_COMPONENT_GITHUB_TOKEN: ${{ github.token }}
        with:
          phase: protected
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Upload native test artifacts
        if: ${{ needs.plan.outputs.host_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-host-test-input
          path: ${{ needs.plan.outputs.host_artifact }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve code review diagnostics
        if: ${{ always() && needs.authorize.outputs.mode == 'readonly' }}
        uses: actions/upload-artifact@v7
        with:
          name: code-review-findings
          path: build/code-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve rules diagnostics
        if: ${{ always() && needs.authorize.outputs.mode == 'readonly' }}
        uses: actions/upload-artifact@v7
        with:
          name: rules-audit-findings
          path: build/rules-audit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Export local generated plan
        if: ${{ env.ACT == 'true' && needs.authorize.outputs.mode == 'generated' }}
        uses: actions/upload-artifact@v7
        with:
          name: start
          path: build/run/${{ env.CI_LOCAL_RUN_ID }}/start/
          if-no-files-found: error
      - name: Preserve generated execution results
        if: ${{ always() && needs.authorize.outputs.mode == 'generated' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-execution
          path: build/run/
          if-no-files-found: ignore
          retention-days: 3

  test:
    name: Test (${{ matrix.id }})
    needs: [execute, plan]
    if: ${{ needs.plan.outputs.host_tests == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ci-host-test-input
          path: verified
      - name: Run native executable and verify output
        shell: pwsh
        env:
          TEST_FILE: ${{ matrix.file }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $PWD ("verified/" + $env:TEST_FILE)
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing executable: $binary" }
          $lines = @(& $binary)
          if ($LASTEXITCODE -ne 0) { throw "Executable exited with $LASTEXITCODE" }
          foreach ($line in (ConvertFrom-Json $env:EXPECTED)) {
            if ($lines -notcontains $line) { throw "Expected output missing: $line" }
          }

  report:
    name: Collect
    needs: [execute, plan, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize execution
        env:
          EXECUTION_RESULT: ${{ needs.execute.result }}
          HOST_TESTS: ${{ needs.plan.outputs.host_tests }}
          HOST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          {
            echo "### CI Engine execution"
            echo ""
            echo "Execution result: **$EXECUTION_RESULT**"
            echo ""
            echo "Project diagnostics and generated-run artifacts are attached to the execution job."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$EXECUTION_RESULT" = success
          if [[ "$HOST_TESTS" == true ]]; then test "$HOST_RESULT" = success; fi

  cleanup:
    name: Cleanup
    needs: report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Finalize engine lifecycle
        env:
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          set -euo pipefail
          echo "CI Engine: runner workspaces are ephemeral."
          echo "CI Engine: the generated execution adapter owns cleanup of its remote branches and artifacts."
          test "$REPORT_RESULT" = success

  validate:
    name: validate
    needs: [resolve, cleanup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report independent execution to PR
        if: ${{ needs.resolve.outputs.check != '' }}
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ needs.resolve.outputs.check }}
          CI_CHECK_RESULT: ${{ needs.cleanup.result }}
        with:
          phase: status
          operation: ${{ inputs.operation }}
      - name: Require completed pipeline
        env:
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          set -euo pipefail
          test "$CLEANUP_RESULT" = success
