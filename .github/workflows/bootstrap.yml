name: CI Engine

on:
  workflow_call:
    inputs:
      request:
        description: Independent dispatch request envelope
        type: string
        required: false
        default: ''
      operation:
        description: Consumer-defined operation selected by the calling workflow
        type: string
        required: true
      publish:
        description: Explicit publication confirmation
        type: boolean
        required: false
        default: false
    secrets:
      CI_APP_PRIVATE_KEY:
        description: Environment-scoped GitHub App key for repository ruleset sync
        required: false
      CI_TOKEN:
        description: Environment-scoped token for Projects sync
        required: false
      CLOUDFLARE_API_TOKEN:
        description: Environment-scoped Cloudflare Pages publication credential
        required: false


# Each executable job receives only the authority of its static permission lane.
jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      event: ${{ steps.admit.outputs.event }}
      ref: ${{ steps.admit.outputs.ref }}
      sha: ${{ steps.admit.outputs.sha }}
      checkout: ${{ steps.admit.outputs.checkout }}
      action: ${{ steps.admit.outputs.action }}
      trusted: ${{ steps.admit.outputs.trusted }}
      review_pr: ${{ steps.admit.outputs.review_pr }}
      check: ${{ steps.admit.outputs.check }}
      inputs: ${{ steps.admit.outputs.inputs }}
      operation: ${{ steps.route.outputs.operation }}
      mode: ${{ steps.route.outputs.mode }}
      publication: ${{ steps.route.outputs.publication }}
    steps:
      - name: Admit immutable execution request
        id: admit
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: admit
          request: ${{ inputs.request }}
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.admit.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve configured operation
        id: route
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ORIGIN_EVENT: ${{ steps.admit.outputs.event }}
          CI_ORIGIN_REF: ${{ steps.admit.outputs.ref }}
          CI_ORIGIN_SHA: ${{ steps.admit.outputs.sha }}
          CI_ORIGIN_ACTION: ${{ steps.admit.outputs.action }}
          CI_ORIGIN_INPUTS: ${{ steps.admit.outputs.inputs }}
        with:
          phase: resolve
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  prepare:
    name: Prepare
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Prepare workspace
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.resolve.outputs.operation }}
        with:
          phase: prepare
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  discover:
    name: Discover
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Discover declared work
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: discover
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  inspect:
    name: Inspect
    needs: resolve
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Inspect event and trust policy
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: inspect
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  plan:
    name: Plan
    needs: [resolve, discover]
    outputs:
      host_tests: ${{ steps.plan.outputs.host_tests }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      host_artifact: ${{ steps.plan.outputs.host_artifact }}
      delivery_artifact: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_artifact || steps.delivery.outputs.delivery_artifact }}
      delivery_destination: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_destination || steps.delivery.outputs.delivery_destination }}
      delivery_prepare_ref: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_prepare_ref || steps.delivery.outputs.delivery_prepare_ref }}
      delivery_prepare_command: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_prepare_command || steps.delivery.outputs.delivery_prepare_command }}
      delivery_prepare_env: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_prepare_env || steps.delivery.outputs.delivery_prepare_env }}
      delivery_contents: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_contents || steps.delivery.outputs.delivery_contents }}
      delivery_issues: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_issues || steps.delivery.outputs.delivery_issues }}
      delivery_credential: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_credential || steps.delivery.outputs.delivery_credential }}
      delivery_pages: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_pages || steps.delivery.outputs.delivery_pages }}
      delivery_external: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_external || steps.delivery.outputs.delivery_external }}
      delivery_has_contents: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_has_contents || steps.delivery.outputs.delivery_has_contents }}
      delivery_has_issues: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_has_issues || steps.delivery.outputs.delivery_has_issues }}
      delivery_has_credential: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_has_credential || steps.delivery.outputs.delivery_has_credential }}
      delivery_has_pages: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_has_pages || steps.delivery.outputs.delivery_has_pages }}
      delivery_has_external: ${{ needs.resolve.outputs.event == 'pull_request' && steps.review_delivery.outputs.delivery_has_external || steps.delivery.outputs.delivery_has_external }}
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review delivery configuration
        if: ${{ needs.resolve.outputs.review_pr != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve authorized review delivery
        id: review_delivery
        if: ${{ needs.resolve.outputs.review_pr != '' }}
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVIEW_PR: ${{ needs.resolve.outputs.review_pr }}
          CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: delivery-plan
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Build validated execution graph
        id: plan
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: plan
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

      - name: Set up delivery planner runtime
        if: ${{ needs.resolve.outputs.mode == 'staged' && needs.resolve.outputs.trusted == 'true' }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Resolve staged delivery
        id: delivery
        if: ${{ needs.resolve.outputs.mode == 'staged' && needs.resolve.outputs.trusted == 'true' }}
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          phase: delivery-plan
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  authorize:
    name: Authorize
    needs: [resolve, plan, inspect]
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.permission.outputs.operation }}
      mode: ${{ steps.permission.outputs.mode }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          persist-credentials: false
      - name: Validate trust boundary
        id: permission
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
        with:
          phase: authorize
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  execute:
    name: Execute
    needs: [resolve, prepare, plan, authorize]
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    environment:
      name: ci-readonly
      deployment: false
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute read-only components
        uses: $/
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_ENGINE_SELECTED_OPERATION: ${{ needs.authorize.outputs.operation }}
        with:
          phase: execute
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Checkout isolated delivery candidate
        if: ${{ (needs.resolve.outputs.trusted == 'true' || needs.resolve.outputs.review_pr != '') && needs.plan.outputs.delivery_prepare_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.delivery_prepare_ref }}
          path: build/ci-candidate
          persist-credentials: false
      - name: Prepare isolated delivery artifact
        if: ${{ (needs.resolve.outputs.trusted == 'true' || needs.resolve.outputs.review_pr != '') && needs.plan.outputs.delivery_prepare_ref != '' }}
        uses: $/
        env:
          CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_REVIEW_PR: ${{ needs.resolve.outputs.review_pr }}
          CI_DELIVERY_PREPARE_COMMAND: ${{ needs.plan.outputs.delivery_prepare_command }}
          CI_DELIVERY_PREPARE_ENV: ${{ needs.plan.outputs.delivery_prepare_env }}
        with:
          phase: delivery-prepare
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Preserve verified delivery inputs
        if: ${{ (needs.resolve.outputs.trusted == 'true' || needs.resolve.outputs.review_pr != '') && needs.plan.outputs.delivery_artifact != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_artifact }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Export local native build bundles
        if: ${{ env.ACT == 'true' && needs.plan.outputs.host_artifact != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-bundles
          path: build/run/${{ env.CI_LOCAL_RUN_ID }}/transport/bundles/
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload native test artifacts
        if: ${{ needs.plan.outputs.host_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-host-test-input
          path: ${{ needs.plan.outputs.host_artifact }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve code review diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-review-findings
          path: build/code-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve rules diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rules-audit-findings
          path: build/rules-audit/
          if-no-files-found: ignore
          retention-days: 7


  test:
    name: Test (${{ matrix.id }})
    needs: [execute, plan]
    if: ${{ needs.plan.outputs.host_tests == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ci-host-test-input
          path: verified
      - name: Run native executable and verify output
        shell: pwsh
        env:
          TEST_FILE: ${{ matrix.file }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $PWD ("verified/" + $env:TEST_FILE)
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing executable: $binary" }
          $lines = @(& $binary)
          if ($LASTEXITCODE -ne 0) { throw "Executable exited with $LASTEXITCODE" }
          foreach ($line in (ConvertFrom-Json $env:EXPECTED)) {
            if ($lines -notcontains $line) { throw "Expected output missing: $line" }
          }

  publish_contents:
    name: Publish (contents - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && inputs.publish && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_contents == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_contents || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: contents
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLOT_0: ${{ matrix.bindings[0].source == 'secret' && secrets[matrix.bindings[0].name] || matrix.bindings[0].source == 'variable' && vars[matrix.bindings[0].name] || '' }}
          CI_SLOT_1: ${{ matrix.bindings[1].source == 'secret' && secrets[matrix.bindings[1].name] || matrix.bindings[1].source == 'variable' && vars[matrix.bindings[1].name] || '' }}
          CI_SLOT_2: ${{ matrix.bindings[2].source == 'secret' && secrets[matrix.bindings[2].name] || matrix.bindings[2].source == 'variable' && vars[matrix.bindings[2].name] || '' }}
        with:
          phase: delivery-run
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  publish_issues:
    name: Publish (issues - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && inputs.publish && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_issues == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_issues || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: issues
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLOT_0: ${{ matrix.bindings[0].source == 'secret' && secrets[matrix.bindings[0].name] || matrix.bindings[0].source == 'variable' && vars[matrix.bindings[0].name] || '' }}
          CI_SLOT_1: ${{ matrix.bindings[1].source == 'secret' && secrets[matrix.bindings[1].name] || matrix.bindings[1].source == 'variable' && vars[matrix.bindings[1].name] || '' }}
          CI_SLOT_2: ${{ matrix.bindings[2].source == 'secret' && secrets[matrix.bindings[2].name] || matrix.bindings[2].source == 'variable' && vars[matrix.bindings[2].name] || '' }}
        with:
          phase: delivery-run
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  publish_credential:
    name: Publish (credential - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && inputs.publish && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_credential == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_credential || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: credential
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLOT_0: ${{ matrix.bindings[0].source == 'secret' && secrets[matrix.bindings[0].name] || matrix.bindings[0].source == 'variable' && vars[matrix.bindings[0].name] || '' }}
          CI_SLOT_1: ${{ matrix.bindings[1].source == 'secret' && secrets[matrix.bindings[1].name] || matrix.bindings[1].source == 'variable' && vars[matrix.bindings[1].name] || '' }}
          CI_SLOT_2: ${{ matrix.bindings[2].source == 'secret' && secrets[matrix.bindings[2].name] || matrix.bindings[2].source == 'variable' && vars[matrix.bindings[2].name] || '' }}
        with:
          phase: delivery-run
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  publish_pages:
    name: Publish (pages - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && inputs.publish && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_pages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_pages || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-site-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: pages
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLOT_0: ${{ matrix.bindings[0].source == 'secret' && secrets[matrix.bindings[0].name] || matrix.bindings[0].source == 'variable' && vars[matrix.bindings[0].name] || '' }}
          CI_SLOT_1: ${{ matrix.bindings[1].source == 'secret' && secrets[matrix.bindings[1].name] || matrix.bindings[1].source == 'variable' && vars[matrix.bindings[1].name] || '' }}
          CI_SLOT_2: ${{ matrix.bindings[2].source == 'secret' && secrets[matrix.bindings[2].name] || matrix.bindings[2].source == 'variable' && vars[matrix.bindings[2].name] || '' }}
        with:
          phase: delivery-run
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Resolve deployment artifact
        id: options
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          phase: delivery-options
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}
      - name: Upload Pages artifact
        if: ${{ steps.options.outputs.delivery_enabled == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ matrix.pages_path }}
      - name: Deploy Pages
        id: deployment
        if: ${{ steps.options.outputs.delivery_enabled == 'true' }}
        uses: actions/deploy-pages@v4

  publish_external:
    name: Publish (external - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && ((needs.resolve.outputs.trusted == 'true' && needs.authorize.outputs.mode == 'staged' && inputs.publish) || (needs.resolve.outputs.review_pr != '' && needs.resolve.outputs.event == 'pull_request' && needs.authorize.outputs.mode == 'readonly' && !inputs.publish)) && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_external == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_external || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: write
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_REVIEW_PR: ${{ needs.resolve.outputs.review_pr }}
      CI_DELIVERY_LANE: external
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.event == 'pull_request' && github.sha || needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLOT_0: ${{ matrix.bindings[0].source == 'secret' && secrets[matrix.bindings[0].name] || matrix.bindings[0].source == 'variable' && vars[matrix.bindings[0].name] || '' }}
          CI_SLOT_1: ${{ matrix.bindings[1].source == 'secret' && secrets[matrix.bindings[1].name] || matrix.bindings[1].source == 'variable' && vars[matrix.bindings[1].name] || '' }}
          CI_SLOT_2: ${{ matrix.bindings[2].source == 'secret' && secrets[matrix.bindings[2].name] || matrix.bindings[2].source == 'variable' && vars[matrix.bindings[2].name] || '' }}
        with:
          phase: delivery-run
          operation: ${{ inputs.operation }}
          publish: ${{ inputs.publish }}

  report:
    name: Collect
    needs: [execute, plan, test, publish_contents, publish_issues, publish_credential, publish_pages, publish_external]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize execution
        env:
          EXECUTION_RESULT: ${{ needs.execute.result }}
          HOST_TESTS: ${{ needs.plan.outputs.host_tests }}
          HOST_RESULT: ${{ needs.test.result }}
          CONTENTS_REQUIRED: ${{ needs.plan.outputs.delivery_has_contents }}
          CONTENTS_RESULT: ${{ needs.publish_contents.result }}
          ISSUES_REQUIRED: ${{ needs.plan.outputs.delivery_has_issues }}
          ISSUES_RESULT: ${{ needs.publish_issues.result }}
          CREDENTIAL_REQUIRED: ${{ needs.plan.outputs.delivery_has_credential }}
          CREDENTIAL_RESULT: ${{ needs.publish_credential.result }}
          PAGES_REQUIRED: ${{ needs.plan.outputs.delivery_has_pages }}
          PAGES_RESULT: ${{ needs.publish_pages.result }}
          EXTERNAL_REQUIRED: ${{ needs.plan.outputs.delivery_has_external }}
          EXTERNAL_RESULT: ${{ needs.publish_external.result }}
        run: |
          set -euo pipefail
          {
            echo "### CI Engine execution"
            echo ""
            echo "Execution result: **$EXECUTION_RESULT**"
            echo ""
            echo "Project diagnostics and delivery inputs are attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$EXECUTION_RESULT" = success
          if [[ "$HOST_TESTS" == true ]]; then test "$HOST_RESULT" = success; fi
          if [[ "$CONTENTS_REQUIRED" == true ]]; then test "$CONTENTS_RESULT" = success; fi
          if [[ "$ISSUES_REQUIRED" == true ]]; then test "$ISSUES_RESULT" = success; fi
          if [[ "$CREDENTIAL_REQUIRED" == true ]]; then test "$CREDENTIAL_RESULT" = success; fi
          if [[ "$PAGES_REQUIRED" == true ]]; then test "$PAGES_RESULT" = success; fi
          if [[ "$EXTERNAL_REQUIRED" == true ]]; then test "$EXTERNAL_RESULT" = success; fi

  cleanup:
    name: Cleanup
    needs: report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Finalize engine lifecycle
        env:
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          set -euo pipefail
          echo "CI Engine: runner workspaces are ephemeral."
          echo "CI Engine: no temporary execution branches were created."
          test "$REPORT_RESULT" = success

  validate:
    name: validate
    needs: [resolve, cleanup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report independent execution to PR
        if: ${{ needs.resolve.outputs.check != '' }}
        uses: $/
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ needs.resolve.outputs.check }}
          CI_CHECK_RESULT: ${{ needs.cleanup.result }}
        with:
          phase: status
          operation: ${{ inputs.operation }}
      - name: Require completed pipeline
        env:
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          set -euo pipefail
          test "$CLEANUP_RESULT" = success
