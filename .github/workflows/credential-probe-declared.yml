name: Credential probe (declared)
on:
  workflow_call:
    secrets:
      ENGINE_PROBE_SECRET:
        required: false
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    strategy:
      matrix:
        environment: [ci-engine-credential-probe]
        secret_name: [ENGINE_PROBE_SECRET]
        variable_name: [ENGINE_PROBE_VARIABLE]
    environment: ${{ matrix.environment }}
    steps:
      - name: Compare presence without logging credentials
        shell: bash
        env:
          STATIC_SECRET: ${{ secrets.ENGINE_PROBE_SECRET }}
          DYNAMIC_SECRET: ${{ secrets[matrix.secret_name] }}
          CONTROL_VARIABLE: ${{ vars[matrix.variable_name] }}
        run: |
          set -euo pipefail
          for key in STATIC_SECRET DYNAMIC_SECRET CONTROL_VARIABLE; do
            if [[ "${!key}" == "engine-probe-only" ]]; then
              echo "$key: expected fixture present"
            elif [[ -z "${!key}" ]]; then
              echo "$key: absent"
            else
              echo "$key: unexpected value (not printed)"
            fi
          done
