name: CI Engine Bootstrap
description: Resolve and execute unprivileged project-defined CI components
inputs:
  operation:
    description: Optional operation name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Execute engine
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI_REQUESTED_OPERATION: ${{ inputs.operation }}
      run: |
        set -euo pipefail
        mise exec -C "$GITHUB_ACTION_PATH" -- lute run "$GITHUB_ACTION_PATH/src/init.luau"
