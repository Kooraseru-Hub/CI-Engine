name: CI Engine
description: Resolve or execute a project-defined CI operation
inputs:
  operation:
    description: Consumer-defined operation selected by the caller
    required: true
  publish:
    description: Explicit manual publication confirmation
    required: false
    default: "false"
  request:
    description: Validated dispatch request envelope
    required: false
    default: ""
  phase:
    description: resolve, prepare, discover, inspect, plan, authorize, execute, native, generated, or protected
    required: false
    default: execute
outputs:
  event:
    description: Admission event
    value: ${{ steps.admission.outputs.event }}
  ref:
    description: Admission ref
    value: ${{ steps.admission.outputs.ref }}
  sha:
    description: Admission sha
    value: ${{ steps.admission.outputs.sha }}
  checkout:
    description: Admission checkout
    value: ${{ steps.admission.outputs.checkout }}
  action:
    description: Admission action
    value: ${{ steps.admission.outputs.action }}
  trusted:
    description: Admission trusted
    value: ${{ steps.admission.outputs.trusted }}
  check:
    description: Admission check
    value: ${{ steps.admission.outputs.check }}
  inputs:
    description: Admission inputs
    value: ${{ steps.admission.outputs.inputs }}
  operation:
    description: Validated operation
    value: ${{ steps.engine.outputs.operation }}
  mode:
    description: Validated execution mode
    value: ${{ steps.engine.outputs.mode }}
  environment:
    description: Trusted execution environment
    value: ${{ steps.engine.outputs.environment }}
  plan:
    description: Generated execution plan
    value: ${{ steps.engine.outputs.plan }}
  native:
    description: Whether the read-only operation declares a native execution adapter
    value: ${{ steps.engine.outputs.native }}
  publication:
    description: Whether this operation permits publication
    value: ${{ steps.engine.outputs.publication }}
  branch_prefix:
    description: Generated temporary branch namespace
    value: ${{ steps.engine.outputs.branch_prefix }}
runs:
  using: composite
  steps:
    - name: Admit request or report status
      if: ${{ inputs.phase == 'admit' || inputs.phase == 'status' }}
      id: admission
      shell: bash
      env:
        CI_DISPATCH_REQUEST: ${{ inputs.request }}
        CI_DISPATCH_OPERATION: ${{ inputs.operation }}
        CI_DISPATCH_PUBLISH: ${{ inputs.publish }}
        CI_DISPATCH_SENDER: ${{ github.event.sender.login || '' }}
        CI_ADMISSION_PHASE: ${{ inputs.phase }}
      run: node "$GITHUB_ACTION_PATH/src/adapters/github/request.cjs" "$CI_ADMISSION_PHASE"
    - name: Provision engine runtime
      if: ${{ inputs.phase != 'admit' && inputs.phase != 'status' }}
      uses: jdx/mise-action@v5
      with:
        version: "2026.11.8"
        working_directory: ${{ github.action_path }}
        install: true
    - name: Run selected engine phase
      if: ${{ inputs.phase != 'admit' && inputs.phase != 'status' }}
      id: engine
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CI_REQUESTED_OPERATION: ${{ inputs.operation }}
        CI_REQUESTED_PUBLISH: ${{ inputs.publish }}
        CI_ENGINE_PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        mise -C "$GITHUB_ACTION_PATH" exec -- bash -c 'cd "$GITHUB_WORKSPACE" && exec lute run "$GITHUB_ACTION_PATH/src/init.luau"'
