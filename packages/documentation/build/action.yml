name: Build documentation
description: Build a static documentation site using the shared Astro renderer
inputs:
  directory:
    description: Consumer-relative authored documentation directory
    required: true
  images:
    description: Consumer-relative image directory containing favicon.png
    required: true
  theme:
    description: Consumer-relative optional theme override
    default: content/theme.css
  output:
    description: Consumer-relative static output directory
    required: true
  base:
    description: Optional root-relative site base
    default: ''
  site:
    description: Optional public origin
    default: ''
  renderer-ref:
    description: Immutable Documentation repository commit SHA
    default: '10098c0d80396a92945d3ad88b52391c683500d8'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DOCS_DIRECTORY: ${{ inputs.directory }}
        DOCS_IMAGES: ${{ inputs.images }}
        DOCS_THEME: ${{ inputs.theme }}
        DOCS_OUTPUT: ${{ inputs.output }}
        DOCS_BASE: ${{ inputs.base }}
        DOCS_SITE: ${{ inputs.site }}
        RENDERER_REF: ${{ inputs.renderer-ref }}
      run: |
        set -euo pipefail
        [[ "$RENDERER_REF" =~ ^[a-f0-9]{40}$ ]]
        renderer="$(mktemp -d "$RUNNER_TEMP/documentation.XXXXXXXX")"
        trap 'rm -rf "$renderer"' EXIT
        git -C "$renderer" init --quiet
        git -C "$renderer" fetch --quiet --no-tags --depth=1 https://github.com/Kooraseru-Hub/Documentation.git "$RENDERER_REF"
        git -C "$renderer" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$renderer" rev-parse HEAD)" = "$RENDERER_REF"
        export DOCS_ROOT="${DOCS_ROOT:-$GITHUB_WORKSPACE}"
        cd "$renderer/package/build/renderer"
        node build.cjs
