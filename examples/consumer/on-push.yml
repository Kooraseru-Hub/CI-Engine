# Substitute the reviewed engine commit SHA.
name: Push
on: push
permissions: {}
jobs:
  ci:
    name: CI Engine
    uses: Kooraseru-Hub/CI-Engine/.github/workflows/bootstrap.yml@PIN_ENGINE_COMMIT_SHA
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
      issues: write
      pages: write
      id-token: write
    with:
      operation: smoke
